services:
  - type: web
    name: narrativeforge-fullstack
    runtime: python
    buildCommand: bash ../build.sh
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: SOSO_API_KEY
        sync: false
      - key: VALUECHAIN_RPC_URL
        value: https://testnet-rpc.valuechain.dev
      - key: PRIVATE_KEY
        sync: false
